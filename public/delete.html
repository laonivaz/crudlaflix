<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>laflix - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">LAFLIX</a>
    </header>

    <div class="caixa larga">
        <h1>Cadastro</h1>
        <form onsubmit="enviarDados(event)">
            <label>Nome:</label>
            <input type="text" id="nome" required>

            <label>Sobrenome:</label>
            <input type="text" id="sobrenome" required>

            <label>CPF:</label>
            <input type="text" id="identificadorCPF" required placeholder="000.000.000-00">

            <label>Email:</label>
            <input type="email" id="email" required>

            <label>Senha:</label>
            <input type="password" id="senha" required>

            <label>CEP (preenche o endereço automaticamente):</label>
            <input type="text" id="cep" required placeholder="00000-000" onblur="buscarCEP(this.value)">

            <label>Rua:</label>
            <input type="text" id="rua" required>

            <label>Cidade:</label>
            <input type="text" id="cidade" required>

            <label>Estado:</label>
            <input type="text" id="estado" required>

            <label>Telefone:</label>
            <input type="text" id="telefone" required>

            <button type="submit" style="width: 100%;">Cadastrar</button>
        </form>

        <p class="link-texto">
            Já tem uma conta? <a href="index.html">Voltar ao Login</a>.
        </p>
    </div>

    <script src="delete.js"></script>
</body>
</html>
